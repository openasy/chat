# Synapse, the Matrix server Chat runs on. This is the part of its configuration Chat relies on; Synapse's own
# documentation describes the rest. Chat never edits this file: it talks to Synapse over its admin and client APIs.
server_name: example.com # the part after the colon in every user id: @jane:example.com
public_baseurl: https://matrix.example.com/ # where Element reaches it; CHAT_HOMESERVER_URL is the same address
report_stats: false
pid_file: /data/homeserver.pid
media_store_path: /data/media_store # every file people share: keep it in your backups
signing_key_path: /data/example.com.signing.key
log_config: /config/log.config
listeners:
  - port: 8008
    type: http
    tls: false
    x_forwarded: true
    resources:
      - names: [client] # no federation listener: federation comes after Chat's first release
# The database, with its password, is in synapse-database.yaml, which Synapse reads after this file: Synapse reads
# no password from a file of its own.

# Chat makes its own admin account with this secret, the first time it starts (CHAT_SYNAPSE_SECRET_FILE).
registration_shared_secret_path: /run/secrets/synapse-registration-secret
enable_registration: false

# Sign-in with Identity, for Element. Synapse makes the account at the first sign-in with the email's local part, the
# same account Chat made for the person from Identity's directory.
oidc_providers:
  - idp_id: identity
    idp_name: Identity
    issuer: https://login.example.com
    client_id: matrix
    client_secret_path: /run/secrets/synapse-oidc-secret
    scopes: [openid, profile, email]
    allow_existing_users: true
    user_mapping_provider:
      config:
        localpart_template: "{{ user.email.split('@')[0] | lower }}"
        display_name_template: "{{ user.name }}"
        email_template: "{{ user.email }}"
# Guests sign in to Element with the password they chose on their welcome link; company people use Identity.
password_config:
  enabled: true

# Retention: Chat sets each channel's m.room.retention; Synapse deletes what is older, once a day.
retention:
  enabled: true
  purge_jobs:
    - interval: 1d

# Channels are not encrypted by default, so search, retention exports and Chat's pages can read them. People can
# still turn encryption on in direct messages; Chat's pages then send them to Element.
encryption_enabled_by_default_for_room_type: "off"
extra_well_known_client_content:
  io.element.e2ee:
    default: false

# Guests find only the people they share a room with.
user_directory:
  enabled: true
  search_all_users: false
# Only Chat publishes rooms in the directory: the channels open to the company.
room_list_publication_rules:
  - user_id: "@openasy-chat:*"
    action: allow
  - action: deny
presence:
  enabled: true
max_upload_size: 50M
# Authenticated media (Matrix 1.11): files are served only to signed-in people.
enable_authenticated_media: true
